name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: go version
        run: go version
      - name: gofmt
        shell: pwsh
        run: |
          $files = gofmt -l ./cmd ./internal ./test
          if ($files) {
            Write-Host "Unformatted files:"
            $files
            exit 1
          }
      - name: go vet
        run: go vet ./...
      - name: go test
        env:
          CGO_ENABLED: "0"
        run: go test ./... -count=1

  linux-race:
    name: Linux race test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: race
        env:
          CGO_ENABLED: "1"
        run: go test -race ./... -count=1

  release:
    name: Release binary
    runs-on: windows-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o shunt.exe ./cmd/shunt
      - name: verify module graph
        run: go list -m all
      - uses: actions/upload-artifact@v4
        with:
          name: shunt-windows-amd64
          path: shunt.exe
          if-no-files-found: error

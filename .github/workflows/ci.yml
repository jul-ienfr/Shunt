name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: go version
        run: go version
      - name: gofmt
        shell: bash
        run: |
          files=$(gofmt -l ./cmd ./internal ./test)
          if [ -n "$files" ]; then
            echo "Unformatted files:"
            echo "$files"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        env:
          CGO_ENABLED: "0"
        run: go test ./... -count=1

  race:
    name: Race (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: go test -race ./... -count=1

  cross:
    name: Cross-compile
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: build every supported target
        env:
          CGO_ENABLED: "0"
        run: |
          set -e
          for target in \
            linux/amd64 linux/arm64 \
            darwin/amd64 darwin/arm64 \
            freebsd/amd64 \
            windows/amd64 windows/arm64; do
            goos=${target%/*}
            goarch=${target#*/}
            out="dist/shunt-${goos}-${goarch}"
            [ "$goos" = windows ] && out="$out.exe"
            echo "building $out"
            GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/shunt
          done
      - name: verify module graph
        run: go list -m all
      - uses: actions/upload-artifact@v4
        with:
          name: shunt-cross
          path: dist/
          if-no-files-found: error
